# PC A - "Europa": no Europa, registo do coordenador, coordenador 2PC, autenticacao, api-1 e servidor NFS.
#
#   docker compose -p gs-pc-a -f distribuido/pc-a.yml --env-file .env --env-file distribuido/enderecos.env up -d --build
#
# Os nomes dos servicos do PC B (db-america, banco-parceiro, api-2) sao resolvidos para IP_PC_B
# atraves de extra_hosts (equivalente a uma entrada no ficheiro hosts: DNS local). Os certificados
# continuam validos porque o nome usado na ligacao e o mesmo (db-america, banco-parceiro, ...).

name: gs-pc-a

x-remotos: &remotos                      # servicos que estao no PC B
  - "db-america:${IP_PC_B:?defina IP_PC_B em distribuido/enderecos.env}"
  - "banco-parceiro:${IP_PC_B}"
  - "api-2:${IP_PC_B}"

x-postgres: &postgres
  image: postgres:17.12-alpine
  restart: unless-stopped
  entrypoint: ["/bin/sh", "/bd/arrancar.sh"]
  command: ["postgres", "-c", "ssl=on",
            "-c", "ssl_cert_file=/var/lib/postgresql/tls/servidor.crt",
            "-c", "ssl_key_file=/var/lib/postgresql/tls/servidor.key",
            "-c", "ssl_min_protocol_version=TLSv1.2", "-c", "hba_file=/bd/pg_hba.conf",
            "-c", "max_connections=40", "-c", "max_prepared_transactions=40",
            "-c", "shared_buffers=32MB", "-c", "log_statement=all", "-c", "log_line_prefix=%m [%p] %u@%d "]
  mem_limit: 256m
  networks: [rede]

x-python: &python
  restart: unless-stopped
  mem_limit: 192m
  extra_hosts: *remotos
  networks: [rede]

services:
  db-europa:
    <<: *postgres
    hostname: db-europa
    environment:
      NO: db-europa
      PGPORT: "5433"
      POSTGRES_DB: globalscale
      POSTGRES_PASSWORD: ${PG_SENHA_ADMIN}
      PG_SENHA_LEITURA: ${PG_SENHA_LEITURA}
      PG_SENHA_TRANSACCOES: ${PG_SENHA_TRANSACCOES}
    volumes:
      - dados-europa:/var/lib/postgresql/data
      - ../bd/arrancar.sh:/bd/arrancar.sh:ro
      - ../bd/pg_hba.conf:/bd/pg_hba.conf:ro
      - ../bd/regional/00-papeis.sh:/docker-entrypoint-initdb.d/00-papeis.sh:ro
      - ../bd/regional/01-esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ../bd/europa/02-fragmento-dados.sql:/docker-entrypoint-initdb.d/02-fragmento-dados.sql:ro
    secrets: [ca.crt, db-europa.crt, db-europa.key]
    ports: ["5433:5433"]                 # o PC B (api-2) le saldos europeus
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5433", "-U", "postgres"]
      interval: 3s
      retries: 40

  db-coordenador:
    <<: *postgres
    hostname: db-coordenador
    environment:
      NO: db-coordenador
      PGPORT: "5435"
      POSTGRES_DB: globalscale
      POSTGRES_PASSWORD: ${PG_SENHA_ADMIN}
      PG_SENHA_COORDENADOR: ${PG_SENHA_COORDENADOR}
    volumes:
      - dados-coordenador:/var/lib/postgresql/data
      - ../bd/arrancar.sh:/bd/arrancar.sh:ro
      - ../bd/pg_hba.conf:/bd/pg_hba.conf:ro
      - ../bd/coordenador/00-papel.sh:/docker-entrypoint-initdb.d/00-papel.sh:ro
      - ../bd/coordenador/01-esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    secrets: [ca.crt, db-coordenador.crt, db-coordenador.key]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5435", "-U", "postgres"]
      interval: 3s
      retries: 40

  nfs:
    build: ../nfs
    image: global-scale-nfs
    restart: unless-stopped
    privileged: true
    mem_limit: 128m
    volumes: [nfs-exportacao:/exports/dfs]
    ports: ["2049:2049"]                 # o Docker do PC B monta o DFS por aqui
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/2049"]
      interval: 3s
      retries: 30
    networks: [rede]

  auth:
    <<: *python
    build: { context: .., dockerfile: servicos/Dockerfile, args: { SERVICO: autenticacao } }
    image: global-scale-autenticacao
    hostname: auth
    environment: { INSTANCIA: auth, PG_SENHA_LEITURA: "${PG_SENHA_LEITURA}" }
    secrets: [ca.crt, auth.crt, auth.key, jwt-privada.pem]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-m", "comum.saude", "https://localhost:8000/saude"]
      interval: 5s
      retries: 20
    depends_on: { db-europa: { condition: service_healthy } }

  coordenador:
    <<: *python
    build: { context: .., dockerfile: servicos/Dockerfile, args: { SERVICO: coordenador } }
    image: global-scale-coordenador
    hostname: coordenador
    environment:
      INSTANCIA: coordenador
      PG_SENHA_TRANSACCOES: ${PG_SENHA_TRANSACCOES}
      PG_SENHA_COORDENADOR: ${PG_SENHA_COORDENADOR}
      LABORATORIO: ${LABORATORIO:-0}
      CHAVE_LABORATORIO: ${CHAVE_LABORATORIO}
    secrets: [ca.crt, coordenador.crt, coordenador.key, jwt-publica.pem,
              assinatura-api-1.pub.pem, assinatura-api-2.pub.pem]
    volumes: [dfs:/mnt/dfs, espera-coordenador:/var/spool/gs-auditoria]
    ports: ["8100:8100"]                 # o api-2 do PC B envia-lhe as ordens
    healthcheck:
      test: ["CMD", "python", "-m", "comum.saude", "https://localhost:8100/saude"]
      interval: 5s
      retries: 20
    depends_on:
      db-coordenador: { condition: service_healthy }
      db-europa: { condition: service_healthy }
      nfs: { condition: service_healthy }

  api-1:
    <<: *python
    build: { context: .., dockerfile: servicos/Dockerfile, args: { SERVICO: api } }
    image: global-scale-api
    hostname: api-1
    environment: { INSTANCIA: api-1, PORTA: "8001", PG_SENHA_LEITURA: "${PG_SENHA_LEITURA}" }
    secrets: [ca.crt, api-1.crt, api-1.key, jwt-publica.pem, assinatura-api-1.pem]
    volumes: [dfs:/mnt/dfs, espera-api-1:/var/spool/gs-auditoria]
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-m", "comum.saude", "https://localhost:8001/saude"]
      interval: 5s
      retries: 20
    depends_on:
      db-europa: { condition: service_healthy }
      nfs: { condition: service_healthy }

networks:
  rede: { driver: bridge }

volumes:
  dados-europa: {}
  dados-coordenador: {}
  nfs-exportacao: {}
  espera-api-1: {}
  espera-coordenador: {}
  dfs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=127.0.0.1,rw,nfsvers=4.0,port=2049,soft,timeo=50,retrans=2"   # o servidor NFS e local
      device: ":/dfs"

secrets:
  ca.crt: { file: ../segredos/ca.crt }
  auth.crt: { file: ../segredos/auth.crt }
  auth.key: { file: ../segredos/auth.key }
  api-1.crt: { file: ../segredos/api-1.crt }
  api-1.key: { file: ../segredos/api-1.key }
  coordenador.crt: { file: ../segredos/coordenador.crt }
  coordenador.key: { file: ../segredos/coordenador.key }
  db-europa.crt: { file: ../segredos/db-europa.crt }
  db-europa.key: { file: ../segredos/db-europa.key }
  db-coordenador.crt: { file: ../segredos/db-coordenador.crt }
  db-coordenador.key: { file: ../segredos/db-coordenador.key }
  jwt-privada.pem: { file: ../segredos/jwt-privada.pem }
  jwt-publica.pem: { file: ../segredos/jwt-publica.pem }
  assinatura-api-1.pem: { file: ../segredos/assinatura-api-1.pem }
  assinatura-api-1.pub.pem: { file: ../segredos/assinatura-api-1.pub.pem }
  assinatura-api-2.pub.pem: { file: ../segredos/assinatura-api-2.pub.pem }
